<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Control de Asistencia</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .contenedor {
      width: 90%;
      max-width: 450px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    h1 {
      margin-bottom: 10px;
    }

    .estado {
      margin: 20px 0;
      padding: 15px;
      border-radius: 10px;
      background: #f1f1f1;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #1a73e8;
      color: white;
      font-size: 17px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }

    .exito {
      color: #188038;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>📍 Control de Asistencia</h1>

    <p id="mensaje">
      Presiona el botón para verificar tu ubicación.
    </p>

    <div id="estado" class="estado">
      Esperando verificación...
    </div>

    <button id="botonGPS" onclick="verificarUbicacion()">
      📍 VERIFICAR UBICACIÓN
    </button>

    <button id="botonFormulario"
            onclick="irAlFormulario()"
            disabled
            style="display:none;">
      CONTINUAR AL FORMULARIO
    </button>

  </div>


<script>

  // ==========================================
  // UBICACIONES AUTORIZADAS
  // ==========================================

  const ubicaciones = {

    PLANTA: {
      lat: -13.785091,
      lon: -76.168169
    },

    TALLER: {
      lat: -13.7243830,
      lon: -76.2012443
    }

  };


  // ==========================================
  // RADIO PERMITIDO
  // ==========================================

  const RADIO_PERMITIDO = 200;


  // Área detectada
  let area = "";


  // ==========================================
  // CALCULAR DISTANCIA
  // ==========================================

  function calcularDistancia(lat1, lon1, lat2, lon2) {

    const R = 6371000;

    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * Math.PI / 180) *
      Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);

    const c =
      2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

    return R * c;
  }


  // ==========================================
  // VERIFICAR UBICACIÓN
  // ==========================================

  function verificarUbicacion() {

    const estado = document.getElementById("estado");
    const mensaje = document.getElementById("mensaje");
    const botonGPS = document.getElementById("botonGPS");
    const botonFormulario =
      document.getElementById("botonFormulario");


    area = "";


    // Verificar soporte GPS

    if (!navigator.geolocation) {

      estado.innerHTML =
        "❌ Este celular no permite obtener la ubicación.";

      estado.className = "estado error";

      return;
    }


    // Cambiar pantalla

    mensaje.innerHTML =
      "📍 Estamos obteniendo tu ubicación...";

    estado.innerHTML =
      "⏳ Esperando GPS del celular...";

    estado.className = "estado";

    botonGPS.disabled = true;


    // ==========================================
    // SOLICITAR GPS
    // ==========================================

    navigator.geolocation.getCurrentPosition(

      function(position) {

        const lat = position.coords.latitude;
        const lon = position.coords.longitude;


        console.log("LATITUD:", lat);
        console.log("LONGITUD:", lon);


        // Distancia a PLANTA

        const distanciaPlanta =
          calcularDistancia(
            lat,
            lon,
            ubicaciones.PLANTA.lat,
            ubicaciones.PLANTA.lon
          );


        // Distancia a TALLER

        const distanciaTaller =
          calcularDistancia(
            lat,
            lon,
            ubicaciones.TALLER.lat,
            ubicaciones.TALLER.lon
          );


        console.log(
          "Distancia PLANTA:",
          distanciaPlanta
        );

        console.log(
          "Distancia TALLER:",
          distanciaTaller
        );


        // ==========================================
        // PLANTA
        // ==========================================

        if (distanciaPlanta <= RADIO_PERMITIDO) {

          area = "PLANTA";

          estado.innerHTML =
            "✅ Ubicación autorizada<br><br>" +
            "<strong>ÁREA: PLANTA</strong><br><br>" +
            "Distancia: " +
            Math.round(distanciaPlanta) +
            " metros";

          estado.className = "estado exito";

          mensaje.innerHTML =
            "Ubicación verificada correctamente.";

          botonGPS.style.display = "none";

          botonFormulario.style.display = "block";

          botonFormulario.disabled = false;

          return;
        }


        // ==========================================
        // TALLER
        // ==========================================

        if (distanciaTaller <= RADIO_PERMITIDO) {

          area = "TALLER";

          estado.innerHTML =
            "✅ Ubicación autorizada<br><br>" +
            "<strong>ÁREA: TALLER</strong><br><br>" +
            "Distancia: " +
            Math.round(distanciaTaller) +
            " metros";

          estado.className = "estado exito";

          mensaje.innerHTML =
            "Ubicación verificada correctamente.";

          botonGPS.style.display = "none";

          botonFormulario.style.display = "block";

          botonFormulario.disabled = false;

          return;
        }


        // ==========================================
        // FUERA DE LAS ÁREAS
        // ==========================================

        estado.innerHTML =
          "❌ No estás dentro de una ubicación autorizada.<br><br>" +
          "Acércate a PLANTA o TALLER.";

        estado.className = "estado error";

        mensaje.innerHTML =
          "No se pudo validar tu ubicación.";

        botonGPS.disabled = false;

      },


      // ==========================================
      // ERROR GPS
      // ==========================================

      function(error) {

        console.log("ERROR GPS:", error);

        let mensajeError = "";

        if (error.code === 1) {

          mensajeError =
            "❌ Permiso de ubicación rechazado.<br><br>" +
            "Debes permitir el acceso a tu ubicación.";

        }

        else if (error.code === 2) {

          mensajeError =
            "❌ No se pudo determinar tu ubicación.<br><br>" +
            "Activa el GPS del celular e inténtalo nuevamente.";

        }

        else if (error.code === 3) {

          mensajeError =
            "⏱️ La ubicación tardó demasiado.<br><br>" +
            "Activa el GPS y vuelve a intentarlo.";

        }

        else {

          mensajeError =
            "❌ No se pudo obtener tu ubicación.<br><br>" +
            "Activa el GPS y permite el acceso a la ubicación.";

        }


        estado.innerHTML = mensajeError;

        estado.className = "estado error";

        mensaje.innerHTML =
          "No se pudo verificar la ubicación.";

        botonGPS.disabled = false;

      },


      // ==========================================
      // CONFIGURACIÓN GPS
      // ==========================================

      {
        enableHighAccuracy: true,
        timeout: 30000,
        maximumAge: 0
      }

    );

  }


  // ==========================================
  // IR AL FORMULARIO
  // ==========================================

  function irAlFormulario() {

    if (!area) {

      alert(
        "Primero debes verificar tu ubicación."
      );

      return;
    }


    window.location.href =
      "https://script.google.com/macros/s/AKfycbz3WkmCpyq9BS30NTo4J57x80N6XcTSySRh1OEggIstpOQAHxJziMUlPJdJPCfKZJJXmg/exec?area="
      + area;

  }

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de asistencia</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
      padding: 40px 20px;
    }

    .contenedor {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    h1 {
      margin-bottom: 5px;
    }

    h2 {
      margin-top: 5px;
      color: #555;
    }

    #mensaje {
      margin: 30px 0;
      font-size: 18px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #1976d2;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>📋 Control de asistencia</h1>

  <h2 id="areaTexto">
    Verificando área...
  </h2>

  <div id="mensaje">
    📍 Preparando verificación de ubicación...
  </div>

  <button id="boton" onclick="verificarUbicacion()">
    📍 VERIFICAR UBICACIÓN
  </button>

</div>

<script>

// ==========================================
// CONFIGURACIÓN DE ÁREAS
// ==========================================

const CONFIG = {

  // ========================================
  // TALLER
  // ========================================
  TALLER: {

    lat: -13.7243830,

    lng: -76.2012443,

    radio: 20,

    formulario:
      "https://docs.google.com/forms/d/e/1FAIpQLSfSq647MfU1AlTbh3rENY8lwLb6rAd7SRKc0pGv06jWEOlODQ/viewform?usp=pp_url&entry.1533894894=TALLER"
  },


  // ========================================
  // PLANTA
  // ========================================
  PLANTA: {

    lat: -13.784898,

    lng: -76.168030,

    radio: 2000,

    formulario:
      "https://docs.google.com/forms/d/e/1FAIpQLSc3lcCPGovz1kieBOiUDy6W1NB1czCFYmFqa2EPcoD8X6t4BQ/viewform?usp=pp_url&entry.1533894894=PLANTA"
  }

};


// ==========================================
// DETECTAR ÁREA DESDE EL ENLACE
// ==========================================

const parametros =
  new URLSearchParams(window.location.search);

const area =
  (parametros.get("area") || "").toUpperCase();


// ==========================================
// ELEMENTOS DE LA PÁGINA
// ==========================================

const mensaje =
  document.getElementById("mensaje");

const boton =
  document.getElementById("boton");

const areaTexto =
  document.getElementById("areaTexto");


// ==========================================
// VALIDAR ÁREA
// ==========================================

if (!CONFIG[area]) {

  areaTexto.innerHTML =
    "⚠️ Área no válida";

  mensaje.innerHTML =
    "Este enlace no tiene un área válida.";

  boton.disabled = true;

} else {

  areaTexto.innerHTML =
    "ÁREA: <strong>" + area + "</strong>";

}


// ==========================================
// CALCULAR DISTANCIA EN METROS
// ==========================================

function distanciaMetros(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371000;

  const rad = Math.PI / 180;

  const dLat =
    (lat2 - lat1) * rad;

  const dLon =
    (lon2 - lon1) * rad;

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *
    Math.sin(dLon / 2) ** 2;

  const c =
    2 * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

  return R * c;
}


// ==========================================
// VERIFICAR UBICACIÓN
// ==========================================

function verificarUbicacion() {

  if (!CONFIG[area]) {
    return;
  }

  boton.disabled = true;

  mensaje.innerHTML =
    "📍 Buscando tu ubicación...";


  // ========================================
  // COMPROBAR GPS
  // ========================================

  if (!navigator.geolocation) {

    mensaje.innerHTML =
      "❌ Tu navegador no permite obtener la ubicación.";

    boton.disabled = false;

    return;
  }


  // ========================================
  // OBTENER UBICACIÓN
  // ========================================

  navigator.geolocation.getCurrentPosition(

    function(posicion) {

      const lat =
        posicion.coords.latitude;

      const lng =
        posicion.coords.longitude;


      // ======================================
      // CALCULAR DISTANCIA
      // ======================================

      const distancia =
        distanciaMetros(
          lat,
          lng,
          CONFIG[area].lat,
          CONFIG[area].lng
        );


      // ======================================
      // UBICACIÓN AUTORIZADA
      // ======================================

      if (
        distancia <=
        CONFIG[area].radio
      ) {

        mensaje.innerHTML =
          "✅ <strong>Ubicación autorizada</strong>" +
          "<br><br>" +
          "Área: <strong>" +
          area +
          "</strong>" +
          "<br>" +
          "Distancia: " +
          Math.round(distancia) +
          " metros";


        boton.innerHTML =
          "➡️ CONTINUAR AL REGISTRO";

        boton.disabled = false;


        // ====================================
        // IR AL FORMULARIO
        // ====================================

        boton.onclick = function() {

          window.location.href =
            CONFIG[area].formulario;

        };


      }

      // ======================================
      // UBICACIÓN NO AUTORIZADA
      // ======================================

      else {

        mensaje.innerHTML =
          "❌ <strong>Ubicación no autorizada</strong>" +
          "<br><br>" +
          "Estás aproximadamente a " +
          Math.round(distancia) +
          " metros del área autorizada.";


        boton.disabled = false;

      }

    },


    // ========================================
    // ERROR GPS
    // ========================================

    function(error) {

      boton.disabled = false;


      if (error.code === 1) {

        mensaje.innerHTML =
          "❌ Permiso de ubicación denegado." +
          "<br><br>" +
          "Permite la ubicación en tu navegador.";

      }

      else if (error.code === 2) {

        mensaje.innerHTML =
          "❌ No se pudo obtener tu ubicación." +
          "<br><br>" +
          "Verifica que el GPS esté activado.";

      }

      else if (error.code === 3) {

        mensaje.innerHTML =
          "❌ El GPS está tardando demasiado." +
          "<br><br>" +
          "Pulsa nuevamente el botón.";

      }

      else {

        mensaje.innerHTML =
          "❌ Error al obtener la ubicación.";

      }

    },


    // ========================================
    // CONFIGURACIÓN GPS
    // ========================================

    {
      enableHighAccuracy: true,

      timeout: 20000,

      maximumAge: 0
    }

  );

}

</script>

</body>
</html>
